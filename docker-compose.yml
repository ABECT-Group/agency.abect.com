# Прод на VPS: поруч із цією текою на сервері лежать scripts/ (restart-frontend.sh) і
# secrets/.env.frontend — обидві поза git. Деталі сервера — у приватному runbook власника.
#
# ⚠️ `name:` і `image:` — НЕ косметика: на сервері кілька проектів, і без явних імен Compose
#    бере назву з теки (`frontend`) — образи різних проектів можуть перезаписати один одного.
# ⚠️ MongoDB — окремий спільний контейнер на сервері; доступ до нього — через external-мережу нижче.
name: agency-abect

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Заглушки для білду (БД під час білду не використовується)
        PAYLOAD_SECRET: build-placeholder-secret-not-real
        DATABASE_URI: mongodb://placeholder:placeholder@127.0.0.1:27017/placeholder?authSource=admin
        # NEXT_PUBLIC_* вшиваються в бандл на білді: підставляються з shell, тому
        # restart-frontend.sh робить `set -a; source ../secrets/.env.frontend` перед build
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://agency.abect.com}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID:-}
    image: agency-abect-frontend:latest
    restart: unless-stopped
    container_name: agency-abect-frontend
    env_file:
      - ../secrets/.env.frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      # Лише localhost: ззовні — тільки через nginx (HTTPS). Docker обходить ufw,
      # тож "3333:3000" відкривав застосунок і адмінку по HTTP в інтернет.
      - "127.0.0.1:3333:3000"
    volumes:
      - ./media:/app/media
    networks:
      - mongodb-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  mongodb-net:
    name: mongodb-net
    external: true
