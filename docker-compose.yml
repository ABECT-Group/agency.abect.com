services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Заглушки для білду (БД під час білду не використовується)
        PAYLOAD_SECRET: build-placeholder-secret-not-real
        DATABASE_URI: mongodb://placeholder:placeholder@127.0.0.1:27017/placeholder?authSource=admin
        # Підставляються з .env.frontend (restart.sh робить `source` перед білдом)
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://agency.abect.com}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID:-}
    restart: unless-stopped
    container_name: agency-abect-frontend
    env_file:
      - ../.env.db
      - ../.env.frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      # Лише localhost: ззовні доступ тільки через nginx (HTTPS). Docker обходить ufw,
      # тому "3333:3000" відкривав застосунок і адмінку по HTTP в інтернет (ISS-002).
      - "127.0.0.1:3333:3000"
    volumes:
      - ./media:/app/media
    networks:
      - abect-shared
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  abect-shared:
    external: true
    name: abect-shared
