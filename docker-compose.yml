# agency.abect.com на VPS forze-main-server — той самий патерн, що й у QRHUB (abect):
#
#   /home/admin/www/agency-abect/
#   ├── frontend/   ← цей репозиторій (гілка prod), тут лежить цей файл
#   ├── scripts/    ← restart-frontend.sh, backup-media.sh (поза git, з AgencyAbect/scripts)
#   └── secrets/    ← .env.frontend (поза git, chmod 600)
#
# ⚠️ `name:` і `image:` — НЕ косметика. Без них Compose бере назву з теки (`frontend`),
#    а на цьому сервері є кілька проектів з текою frontend/backend. Через збіг тегів 2026-07-22
#    одна збірка вже перезаписала чужий образ і поклала чужий прод.
# ⚠️ База — СПІЛЬНИЙ контейнер `mongodb` (replica set rs0, /opt/mongodb), БД `agency-abect`,
#    доступний лише через мережу `mongodb-net`. Власного контейнера Mongo в цього проекту немає.
name: agency-abect

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Заглушки для білду (БД під час білду не використовується)
        PAYLOAD_SECRET: build-placeholder-secret-not-real
        DATABASE_URI: mongodb://placeholder:placeholder@127.0.0.1:27017/placeholder?authSource=admin
        # NEXT_PUBLIC_* вшиваються в бандл на білді: підставляються з shell, тому
        # restart-frontend.sh робить `set -a; source ../secrets/.env.frontend` перед build
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://agency.abect.com}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID:-}
    image: agency-abect-frontend:latest
    restart: unless-stopped
    container_name: agency-abect-frontend
    env_file:
      - ../secrets/.env.frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      # Лише localhost: ззовні — тільки через nginx (HTTPS). Docker обходить ufw,
      # тож "3333:3000" відкривав застосунок і адмінку по HTTP в інтернет.
      - "127.0.0.1:3333:3000"
    volumes:
      - ./media:/app/media
    networks:
      - mongodb-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  mongodb-net:
    name: mongodb-net
    external: true
