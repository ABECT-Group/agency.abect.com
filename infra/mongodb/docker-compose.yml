# MongoDB для agency.abect.com. Запуск на сервері:
#   cd /home/admin/www/abect/frontend/infra/mongodb && docker compose up -d
# Ім'я compose-проекту зафіксоване як "mongodb", тож використовується той самий volume
# (mongodb_mongo_data), що й у старому розташуванні /home/admin/www/abect/mongodb.
name: mongodb

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    container_name: abect-mongo
    env_file:
      - ../../../.env.db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    networks:
      - abect-shared
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:
    driver: local

networks:
  abect-shared:
    external: true
    name: abect-shared
